<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme before first paint so switching to light mode
      // doesn't flash the dark theme for a frame. Mirrors the default in
      // src/context/ThemeContext.tsx (dark, unless explicitly toggled).
      (function () {
        try {
          var stored = localStorage.getItem('cash-section-theme');
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!--
      Deliberately NOT using maximum-scale=1/user-scalable=no here: those
      attributes are known to break normal touch-scrolling on a range of
      mobile browsers (the page gets "stuck" and won't scroll to the
      bottom). Pinch-zoom is instead blocked via a JS multi-touch listener
      in src/main.tsx, which doesn't have that side effect.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Split bills and settle up with your group, on the spot." />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cash Section</title>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
